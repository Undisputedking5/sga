<!-- Public Profile Card -->
<div class="bg-white border border-gray-200 rounded-lg p-6 mb-4">
  <div class="flex items-start gap-8">
    <div class="min-w-[160px]">
      <h2 class="text-base font-semibold text-gray-900">Public Profile</h2>
      <p class="text-sm text-gray-500 mt-1">Update your account information and visual identity within the portal.</p>
    </div>

    <form method="POST" action="{% url 'settings:update_profile' %}" class="flex-1">
      {% csrf_token %}
      <div class="flex items-center gap-3 mb-5">
        <div class="w-16 h-16 rounded-full bg-red-700 flex items-center justify-center text-white text-xl font-bold overflow-hidden">
          {% if admin_data.avatar_url %}
            <img src="{{ admin_data.avatar_url }}" alt="Avatar" class="w-full h-full object-cover">
          {% else %}
            {{ display_name|slice:":1"|upper }}
          {% endif %}
        </div>
        <button type="button" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-medium rounded transition-colors">
          Upload New Photo
        </button>
        <button type="button" class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded hover:bg-gray-50 transition-colors">
          Remove
        </button>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Admin Name</label>
          <input type="text" name="admin_name"
            value="{{ admin_data.display_name|default:display_name }}"
            class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Email Address</label>
          <input type="email" name="email"
            value="{{ admin_data.email|default:email }}"
            class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
        </div>
      </div>

      <div class="flex justify-end">
        <button type="submit" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-medium rounded transition-colors">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Password Card -->
<div class="bg-white border border-gray-200 rounded-lg p-6">
  <div class="flex items-center gap-8">
    <div class="min-w-[160px]">
      <h2 class="text-base font-semibold text-gray-900">Password</h2>
      <p class="text-sm text-gray-500 mt-1">Change your account password to maintain security integrity.</p>
    </div>
    <form method="POST" action="{% url 'settings:reset_password' %}">
      {% csrf_token %}
      <button type="submit" class="flex items-center gap-2 px-5 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded hover:bg-gray-50 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Reset Admin Password
      </button>
    </form>
  </div>
</div>
